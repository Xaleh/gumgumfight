name: CI e deploy

# Todo push/PR roda os testes e monta o pacote. Os testes de ponta a ponta rodam uma vez por mudança, no PR
# (e no "Run workflow"): o push do branch e o push na main não os repetem.
# Só a main publica: push na main (ou "Run workflow" na main) faz o deploy na produção, https://gumgumfight.app
# (a VPS da Hostinger), com os secrets DEPLOY_* do Environment "production" (Settings → Environments).
# "Run workflow" em outro branch só roda os testes: nada é publicado.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      import_sets:
        description: 'Coleções para importar após o deploy, pela cadeia CARD_SOURCES (ex.: ST-01 ST-02, P, --all ou --images). Vazio = não importa. Só vale na main (os outros branches não publicam).'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Nunca cancela um run que pode estar no meio de um deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  SITE_URL: https://gumgumfight.app

jobs:
  test:
    name: Testes e pacote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:release

      - name: Smoke test do pacote (o mesmo que vai para a VM)
        run: |
          export DB_PATH="$RUNNER_TEMP/smoke.db" WEB_DIST="$PWD/release/web" DATA_DIR="$PWD/release/data"
          export PORT=3399 HOST=127.0.0.1 NODE_ENV=production
          node release/server/index.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; cat "$RUNNER_TEMP/server.log"' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:3399/api/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:3399/api/health
          curl -fsS http://127.0.0.1:3399/api/decks | grep -q st01-luffy
          curl -fsS http://127.0.0.1:3399/ | grep -q '<div id="root">'
          # Arquivo de uma versão anterior: 404, nunca a página (ver setNotFoundHandler em app.ts).
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3399/assets/versao-anterior-0000.js)" = 404
          node release/server/import-cards.mjs --dry-run --file apps/server/test/fixtures/optcgapi-sample.json

      - name: Empacota
        run: tar -czf "gumgumfight-${GITHUB_SHA}.tgz" -C release .

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: gumgumfight-${{ github.sha }}.tgz
          retention-days: 7

  e2e:
    name: Testes de ponta a ponta (Playwright)
    # No PR (e no "Run workflow"), não no push: o mesmo commit já passou por aqui antes do merge, e uma falha
    # intermitente destes testes não pode segurar o deploy da main.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium (desktop) e WebKit (o motor do Safari, para os testes @iphone), com as bibliotecas do sistema.
      - name: Navegadores do Playwright
        run: npx playwright install --with-deps chromium webkit

      # Compila o web e roda e2e/ contra o servidor com um banco novo (ver e2e/playwright.config.ts).
      - run: npm run e2e

      # Também quando passa: um teste que só passou na segunda tentativa deixa o trace da primeira.
      - name: Relatório e traces das tentativas que falharam
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/e2e/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy (produção)
    # Só publica com os testes de unidade e o smoke test do pacote passando. Os de ponta a ponta valem no PR,
    # antes do merge (ver o job e2e): um push direto na main, sem PR, chega à produção sem eles.
    needs: [test]
    # Só a main publica: push, ou "Run workflow" na main. Nenhum outro branch chega à produção.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Os secrets/variables do Environment valem sobre os do repositório.
    environment:
      name: production
      url: https://gumgumfight.app
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      REMOTE_DIR: apps/gumgumfight/releases/${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Verifica os secrets de deploy
        id: check
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS || vars.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          SSH_KEY_AS_VARIABLE: ${{ vars.DEPLOY_SSH_KEY != '' }}
        run: |
          if [ "$SSH_KEY_AS_VARIABLE" = true ]; then
            echo "::error::DEPLOY_SSH_KEY foi cadastrada em Variables (visível para quem lê o repositório). Apague-a de Variables e cadastre em Secrets."
            exit 1
          fi
          missing=""
          for pair in SSH_KEY:DEPLOY_SSH_KEY KNOWN_HOSTS:DEPLOY_KNOWN_HOSTS HOST:DEPLOY_HOST USER_NAME:DEPLOY_USER; do
            var="${pair%%:*}"
            [ -n "${!var}" ] || missing="$missing ${pair#*:}"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Deploy pulado: o workflow não encontrou:$missing. Cadastre em Settings → Environments → production → Environment secrets (ou em Repository secrets)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configura o SSH
        if: steps.check.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS || vars.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host vm
            HostName $HOST
            User $USER_NAME
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
          CFG

      - name: Envia o pacote
        if: steps.check.outputs.ready == 'true'
        run: |
          ssh vm "mkdir -p '$REMOTE_DIR'"
          scp "gumgumfight-${GITHUB_SHA}.tgz" "vm:$REMOTE_DIR.tgz"
          ssh vm "tar -xzf '$REMOTE_DIR.tgz' -C '$REMOTE_DIR' && rm -f '$REMOTE_DIR.tgz'"

      - name: Ativa a nova versão (com rollback automático)
        if: steps.check.outputs.ready == 'true'
        env:
          IMPORT_SETS: ${{ github.event.inputs.import_sets }}
          # Client ID do OAuth do Google (público: vai para todo navegador), em Settings → Variables.
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          # E-mails das contas Google que são sempre admin (separados por vírgula), em Settings → Variables.
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
        run: |
          if [ -n "$IMPORT_SETS" ] && ! [[ "$IMPORT_SETS" =~ ^[A-Za-z0-9\ -]+$ ]]; then
            echo "::error::import_sets inválido: use só letras, números, hífen e espaço (ex.: ST-01 ST-02)"
            exit 1
          fi
          if [ -n "$GOOGLE_CLIENT_ID" ] && ! [[ "$GOOGLE_CLIENT_ID" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::GOOGLE_CLIENT_ID inválido: copie o Client ID (termina em .apps.googleusercontent.com)"
            exit 1
          fi
          [ -n "$GOOGLE_CLIENT_ID" ] || echo "::notice::Variable GOOGLE_CLIENT_ID vazia: o login com Google fica como estava no servidor."
          if [ -n "$ADMIN_EMAILS" ] && ! [[ "$ADMIN_EMAILS" =~ ^[A-Za-z0-9.@_+,-]+$ ]]; then
            echo "::error::ADMIN_EMAILS inválido: e-mails separados por vírgula, sem espaços"
            exit 1
          fi
          ssh vm "IMPORT_SETS='$IMPORT_SETS' GOOGLE_CLIENT_ID='$GOOGLE_CLIENT_ID' ADMIN_EMAILS='$ADMIN_EMAILS' bash '$REMOTE_DIR/deploy/remote-deploy.sh' '$REMOTE_DIR'"

      - name: Verifica o site público
        if: steps.check.outputs.ready == 'true'
        run: |
          for _ in $(seq 1 10); do
            curl -fsS "$SITE_URL/api/health" && exit 0
            sleep 3
          done
          echo "::error::$SITE_URL não respondeu. O app está no ar na VM, confira o Nginx/HTTPS (deploy/bootstrap-hostinger.sh ou deploy/setup-vm.sh)."
          exit 1
