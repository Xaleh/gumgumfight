name: Site no ar

# Monitoramento (A2): de fora da VPS, a cada 5 min, confere o /api/health do site. Fora do ar (3 tentativas seguidas,
# 20 s entre elas): abre a issue "Site fora do ar" (rótulo `site-fora-do-ar`, atribuída ao dono do repositório; o
# GitHub manda e-mail e aviso no app) e, com o secret ALERT_WEBHOOK_URL, avisa também por webhook (Discord, Slack ou
# ntfy.sh). De volta: comenta o tempo fora e fecha a issue.
#
# Simular uma queda: Actions → "Site no ar" → Run workflow, com uma URL que falhe (ex.:
# https://gumgumfight.app/api/simula-queda). A issue sai marcada como simulação; a próxima conferência normal a fecha.
#
# O GitHub pode atrasar os agendamentos em alguns minutos quando está carregado.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'URL a conferir. Vazio = o site de produção. Para simular uma queda, use uma URL que falhe (ex.: https://gumgumfight.app/api/simula-queda).'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    name: Confere o site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confere o /api/health
        id: check
        env:
          URL: ${{ inputs.url || vars.UPTIME_URL || 'https://gumgumfight.app/api/health' }}
        run: |
          code=000
          for attempt in 1 2 3; do
            code=$(curl -sS -o body.txt -w '%{http_code}' -m 15 "$URL" 2>/dev/null) || code=000
            if [ "$code" = 200 ] && grep -q '"ok":true' body.txt; then
              echo "up=true" >> "$GITHUB_OUTPUT"
              echo "$URL respondeu (tentativa $attempt)."
              exit 0
            fi
            echo "::warning::$URL não respondeu direito (tentativa $attempt, HTTP $code)."
            [ "$attempt" = 3 ] || sleep 20
          done
          echo "up=false" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Abre ou fecha o alerta
        uses: actions/github-script@v7
        env:
          UP: ${{ steps.check.outputs.up }}
          CODE: ${{ steps.check.outputs.code }}
          URL: ${{ inputs.url || vars.UPTIME_URL || 'https://gumgumfight.app/api/health' }}
          SIMULATED: ${{ inputs.url != '' && github.event_name == 'workflow_dispatch' }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { UP, CODE, URL, SIMULATED, ALERT_WEBHOOK_URL, RUN_URL } = process.env;
            const up = UP === 'true';
            const simulated = SIMULATED === 'true';
            const label = 'site-fora-do-ar';
            const repo = context.repo;
            try {
              await github.rest.issues.getLabel({ ...repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ ...repo, name: label, color: 'd73a4a', description: 'Alerta automático do workflow "Site no ar"' });
            }
            const open = (await github.rest.issues.listForRepo({ ...repo, labels: label, state: 'open', per_page: 10 })).data;
            const webhook = async (text) => {
              if (!ALERT_WEBHOOK_URL) return;
              // Discord lê `content`, Slack lê `text`; o ntfy.sh publica o corpo como está.
              const ntfy = /ntfy\./.test(ALERT_WEBHOOK_URL);
              const res = await fetch(ALERT_WEBHOOK_URL, {
                method: 'POST',
                headers: ntfy ? { title: 'GumGum Fight' } : { 'content-type': 'application/json' },
                body: ntfy ? text : JSON.stringify({ content: text, text }),
              }).catch((e) => ({ ok: false, status: String(e) }));
              if (!res.ok) core.warning(`Webhook do alerta falhou (${res.status}).`);
            };
            const now = new Date();
            if (!up) {
              if (open.length) {
                core.info(`Ainda fora do ar; o alerta já está aberto (#${open[0].number}).`);
                return;
              }
              const title = simulated ? 'Site fora do ar (simulação)' : 'Site fora do ar';
              const body = [
                `${URL} não respondeu em 3 tentativas (último status: HTTP ${CODE || '000'}).`,
                '',
                `- Conferido em: ${now.toISOString()}`,
                `- Execução: ${RUN_URL}`,
                simulated ? '- **Simulação** (Run workflow com uma URL que falha). A próxima conferência normal fecha esta issue.' : '',
                '',
                'O que olhar: `pm2 logs gumgumfight`, `journalctl -t gumgum-watchdog`, `sudo systemctl status nginx` (ver deploy/HOSTINGER.md).',
                'A issue fecha sozinha quando o site voltar.',
              ].filter((l) => l !== null).join('\n');
              const issue = (await github.rest.issues.create({ ...repo, title, body, labels: [label] })).data;
              try {
                await github.rest.issues.addAssignees({ ...repo, issue_number: issue.number, assignees: [repo.owner] });
              } catch {
                // dono é uma organização: fica sem responsável, o aviso vai para quem acompanha o repositório
              }
              await webhook(`🔴 ${title}: ${URL} (HTTP ${CODE || '000'}). ${issue.html_url}`);
              core.setFailed(`${title}: ${URL} (HTTP ${CODE || '000'}). Alerta: ${issue.html_url}`);
              return;
            }
            for (const issue of open) {
              const minutes = Math.max(1, Math.round((now - new Date(issue.created_at)) / 60000));
              await github.rest.issues.createComment({ ...repo, issue_number: issue.number, body: `🟢 ${URL} voltou a responder em ${now.toISOString()} (cerca de ${minutes} min depois do alerta). ${RUN_URL}` });
              await github.rest.issues.update({ ...repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
              await webhook(`🟢 Site de volta (cerca de ${minutes} min). ${issue.html_url}`);
            }
