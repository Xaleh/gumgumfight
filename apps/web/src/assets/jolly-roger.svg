<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Caveira dos Chapéus de Palha (arte própria, em branco): os vazios deixam a cor do dado aparecer. -->
  <defs>
    <mask id="m">
      <rect width="100" height="100" fill="#fff"/>
      <!-- faixa do chapéu -->
      <rect x="29" y="27" width="42" height="5.5" fill="#000"/>
      <!-- olhos -->
      <ellipse cx="39.5" cy="56" rx="7.5" ry="8.5" fill="#000"/>
      <ellipse cx="60.5" cy="56" rx="7.5" ry="8.5" fill="#000"/>
      <!-- nariz -->
      <path d="M50 63.5 L45.2 72.5 H54.8 Z" fill="#000"/>
      <!-- linha da boca e separação dos dentes -->
      <rect x="35" y="76.5" width="30" height="1.8" fill="#000"/>
      <rect x="43.2" y="78" width="1.7" height="9" fill="#000"/>
      <rect x="49.15" y="78" width="1.7" height="9" fill="#000"/>
      <rect x="55.1" y="78" width="1.7" height="9" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff" mask="url(#m)">
    <!-- ossos cruzados -->
    <g transform="rotate(42 50 60)">
      <rect x="4" y="56.5" width="92" height="7" rx="3.5"/>
      <circle cx="6" cy="55.5" r="4.6"/><circle cx="6" cy="64.5" r="4.6"/>
      <circle cx="94" cy="55.5" r="4.6"/><circle cx="94" cy="64.5" r="4.6"/>
    </g>
    <g transform="rotate(-42 50 60)">
      <rect x="4" y="56.5" width="92" height="7" rx="3.5"/>
      <circle cx="6" cy="55.5" r="4.6"/><circle cx="6" cy="64.5" r="4.6"/>
      <circle cx="94" cy="55.5" r="4.6"/><circle cx="94" cy="64.5" r="4.6"/>
    </g>
    <!-- crânio e maxilar -->
    <path d="M24 54 a26 26 0 0 1 52 0 v12 a7 7 0 0 1 -7 7 h-38 a7 7 0 0 1 -7 -7 z"/>
    <rect x="36" y="70" width="28" height="18" rx="4"/>
    <!-- chapéu de palha: copa e aba -->
    <path d="M30 34 v-13 a20 11 0 0 1 40 0 v13 z"/>
    <ellipse cx="50" cy="35.5" rx="44" ry="6"/>
  </g>
</svg>
