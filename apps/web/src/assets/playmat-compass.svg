<svg xmlns="http://www.w3.org/2000/svg" viewBox="-130 -130 260 260">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="-110" y1="110" x2="110" y2="-110">
      <stop offset="0" stop-color="#b98a2e"/>
      <stop offset="0.5" stop-color="#f1c75a"/>
      <stop offset="1" stop-color="#c89637"/>
    </linearGradient>
    <linearGradient id="d" gradientUnits="userSpaceOnUse" x1="-110" y1="110" x2="110" y2="-110">
      <stop offset="0" stop-color="#8f6a22"/>
      <stop offset="1" stop-color="#b5862f"/>
    </linearGradient>
    <g id="spoke"><line x1="0" y1="-64" x2="0" y2="-90"/></g>
    <g id="tick"><line x1="0" y1="-47" x2="0" y2="-57"/></g>
    <g id="tick2"><line x1="0" y1="-27" x2="0" y2="-35"/></g>
  </defs>
  <g fill="none" stroke="url(#g)">
    <circle r="96" stroke-width="3.2"/>
    <circle r="90" stroke-width="1.2"/>
    <circle r="62" stroke-width="2.4"/>
    <circle r="58" stroke-width="0.9"/>
    <circle r="44" stroke-width="3"/>
    <circle r="38" stroke-width="0.9"/>
    <circle r="23" stroke-width="3"/>
    <g id="spokes" stroke-width="1.3">
      <use href="#spoke"/><use href="#spoke" transform="rotate(15)"/><use href="#spoke" transform="rotate(30)"/>
      <use href="#spoke" transform="rotate(45)"/><use href="#spoke" transform="rotate(60)"/><use href="#spoke" transform="rotate(75)"/>
      <use href="#spoke" transform="rotate(90)"/><use href="#spoke" transform="rotate(105)"/><use href="#spoke" transform="rotate(120)"/>
      <use href="#spoke" transform="rotate(135)"/><use href="#spoke" transform="rotate(150)"/><use href="#spoke" transform="rotate(165)"/>
    </g>
    <use href="#spokes" transform="rotate(180)"/>
    <g id="ticks" stroke-width="0.8">
      <use href="#tick"/><use href="#tick" transform="rotate(5)"/><use href="#tick" transform="rotate(10)"/><use href="#tick" transform="rotate(15)"/>
      <use href="#tick" transform="rotate(20)"/><use href="#tick" transform="rotate(25)"/><use href="#tick" transform="rotate(30)"/><use href="#tick" transform="rotate(35)"/>
      <use href="#tick" transform="rotate(40)"/><use href="#tick" transform="rotate(45)"/><use href="#tick" transform="rotate(50)"/><use href="#tick" transform="rotate(55)"/>
    </g>
    <use href="#ticks" transform="rotate(60)"/><use href="#ticks" transform="rotate(120)"/>
    <use href="#ticks" transform="rotate(180)"/><use href="#ticks" transform="rotate(240)"/><use href="#ticks" transform="rotate(300)"/>
    <g id="ticks2" stroke-width="0.8">
      <use href="#tick2"/><use href="#tick2" transform="rotate(7.5)"/><use href="#tick2" transform="rotate(15)"/><use href="#tick2" transform="rotate(22.5)"/>
      <use href="#tick2" transform="rotate(30)"/><use href="#tick2" transform="rotate(37.5)"/><use href="#tick2" transform="rotate(45)"/><use href="#tick2" transform="rotate(52.5)"/>
    </g>
    <use href="#ticks2" transform="rotate(60)"/><use href="#ticks2" transform="rotate(120)"/>
    <use href="#ticks2" transform="rotate(180)"/><use href="#ticks2" transform="rotate(240)"/><use href="#ticks2" transform="rotate(300)"/>
  </g>
  <!-- a agulha, inclinada para cima e para a direita, com um furo no centro -->
  <g transform="rotate(38)">
    <path d="M0 -124 L15 0 L0 124 Z" fill="url(#g)"/>
    <path d="M0 -124 L-15 0 L0 124 Z" fill="url(#d)"/>
    <circle r="11" fill="#141b24" stroke="url(#g)" stroke-width="3"/>
  </g>
</svg>
